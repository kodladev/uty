name: Test
on:
  push:
    branches: main
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/test.yaml'
  pull_request:
    branches: main
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/test.yaml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        env:
          - { node: 24, os: 'ubuntu-latest' }
          - { node: 22, os: 'ubuntu-latest' }
          - { node: 20, os: 'ubuntu-latest' }
          - { node: 18, os: 'ubuntu-latest' }
          - { node: 24, os: 'windows-latest' }
          - { node: 24, os: 'macos-latest' }
    runs-on: ${{ matrix.env.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.env.node }}
      # The npm bundled with Node 22 fails to resolve the dev dependencies; current npm needs Node 22
      - if: matrix.env.node >= 22
        run: npm install --global npm@latest
      - run: npm install
      - run: npm run test -- run
